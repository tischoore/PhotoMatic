[package]
name = "photomatic"
version = "0.1.0"
edition = "2021"

[dependencies]
native-windows-gui = "1.0.13"
native-windows-derive = "1.0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winapi = { version = "0.3", features = ["combaseapi", "objbase"] }

[build-dependencies]
embed-manifest = "1"

[profile.release]
strip = true
